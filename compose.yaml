services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zini_vai_mini
      POSTGRES_USER: zini_vai_mini
      POSTGRES_PASSWORD: zini_vai_mini
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zini_vai_mini -d zini_vai_mini"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/zini_vai_mini
      DATABASE_USERNAME: zini_vai_mini
      DATABASE_PASSWORD: zini_vai_mini
      APP_OWNER_CLERK_USER_ID: ${APP_OWNER_CLERK_USER_ID:?Set APP_OWNER_CLERK_USER_ID in .env}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_Y2FyZWZ1bC1kb2ctMzYuY2xlcmsuYWNjb3VudHMuZGV2JA}
      CLERK_ISSUER: ${CLERK_ISSUER:-https://careful-dog-36.clerk.accounts.dev}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://careful-dog-36.clerk.accounts.dev/.well-known/jwks.json}
      APP_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
