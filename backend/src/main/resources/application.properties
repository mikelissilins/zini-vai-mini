spring.application.name=zini-vai-mini
server.port=${PORT:8080}
spring.main.lazy-initialization=${SPRING_LAZY_INITIALIZATION:false}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/zini_vai_mini}
spring.datasource.username=${DATABASE_USERNAME:zini_vai_mini}
spring.datasource.password=${DATABASE_PASSWORD:zini_vai_mini}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER:https://careful-dog-36.clerk.accounts.dev}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL:https://careful-dog-36.clerk.accounts.dev/.well-known/jwks.json}

app.clerk-publishable-key=${CLERK_PUBLISHABLE_KEY:pk_test_Y2FyZWZ1bC1kb2ctMzYuY2xlcmsuYWNjb3VudHMuZGV2JA}
app.owner-clerk-user-id=${APP_OWNER_CLERK_USER_ID:}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
